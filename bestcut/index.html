    .hero p { margin-top: 12px; font-size: 21px; font-weight: 500; color: var(--muted); letter-spacing: -.01em; }

    .stage { position: relative; }
    .stage::after { content: ''; position: absolute; left: 4%; right: 4%; bottom: -18px; height: 80px; background: #FAFAFA; border-radius: 0 0 28px 28px; z-index: -1; }
    .stage .card { border-radius: 32px; }
    .gal-pin { position: relative; }
    .gal-pin.first { margin-top: 64px; }
    .gal-pin.static .gal-stage { position: static; height: auto; padding: 0; }
    .gal-pin.static .gal-progress { display: none; }
    .gal-pin.static .gal-track { width: auto; justify-content: center; }
    .gal-pin.static .gal-track img { flex: 1 1 0; min-width: 0; max-width: 250px; width: 100%; height: auto; }
    .stage.alt::after { display: none; }
    .stage.alt .card { box-shadow: 0 20px 60px rgba(0,0,0,.08); }
    .gal-stage { position: sticky; top: 0; height: 100vh; height: 100svh; display: flex; flex-direction: column; justify-content: center; padding: 24px 0 112px; }
    .stage .gal-card { padding: 40px 0; overflow: hidden; }
    .gal-track { display: flex; gap: 20px; width: max-content; padding: 0 40px; will-change: transform; }

    .gal-track img:hover { transform: scale(1.02); }
    .gal-progress { width: 120px; height: 3px; margin: 36px auto 0; border-radius: 3px; background: rgba(0,0,0,.08); overflow: hidden; }
    .gal-progress i { display: block; width: 0; height: 100%; background: #000; border-radius: 3px; }

    .meta { display: grid; grid-template-columns: 1fr 1.6fr; gap: 16px; }
    .meta-list { display: flex; flex-direction: column; gap: 24px; }
    .meta-list .value, .overview .value { margin-top: 4px; }
    .overview p.body { margin-top: 10px; font-size: 17px; line-height: 1.6; color: var(--ink); }
    .overview .stack { margin-top: 24px; }

    .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; }
    .features .value { font-size: 20px; }

    .bento { display: grid; gap: 16px; }

    .bento .r2 { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; }

    .foot { margin-top: auto; padding-top: 40px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }

    .foot a:hover { color: var(--muted); }

    .dockbar { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; z-index: 50; }
    .dock, .langs { display: flex; align-items: center; background: rgba(255,255,255,.72); -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8); box-shadow: 0 8px 32px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.06); border-radius: 999px; }
    .dock { gap: 8px; padding: 8px; }
    .dock a { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: var(--card); color: rgba(0,0,0,.62); transition: transform .25s cubic-bezier(.16,1,.3,1); transform-origin: 50% 100%; }
    @media (hover: hover) and (pointer: fine) { .dock a:hover { transform: scale(1.18) translateY(-4px); } }

    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .6s ease-out, transform .6s ease-out; }

    @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } .gal-track img, .dock a { transition: none; } .gal-pin { height: auto !important; } .gal-stage { position: static; height: auto; padding: 0; } .stage .gal-card { overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; } .gal-track { transform: none !important; } .gal-track img { scroll-snap-align: center; height: min(540px, 70svh); } html { scroll-behavior: auto; } }

    @media (max-width: 768px) {

      .gal-track { gap: 14px; padding: 0 20px; }

      .gal-progress { margin-top: 24px; }
      .meta, .features, .bento .r1, .bento .r2, .links { grid-template-columns: 1fr; }
      .card { padding: 24px; }
      .dock { gap: 6px; padding: 6px; }
      .dock a { width: 44px; height: 44px; border-radius: 14px; }
      .langs button { width: 32px; height: 32px; }

  <script>
    const BC_ALT = {"ko": ["비슷한 사진은 한 묶음으로, 베스트 컷은 미리 골라 둬요", "흔들리고 어두운 사진은 알아서 표시해요", "한 장씩 넘기며 빠르게 골라요", "두 장 나란히 놓고 함께 확대해 비교", "고른 사진은 앨범으로, 지우기 전엔 꼭 확인해요", "사진은 iPhone 밖으로 나가지 않아요"], "en": ["Similar shots, grouped. Best one already picked.", "Blurry and dark shots, flagged for you.", "Swipe to pick, one photo at a time.", "Zoom two photos side by side.", "Your picks become an album. You confirm every delete.", "Your photos never leave your iPhone."]};
    const T = {
      ko: {
        tagline: '잘 나온 사진만 남기는 사진 정리 앱',
        lType: '유형', vType: '개인 프로젝트', lRole: '역할', vRole: 'iOS 개발 · 디자인', lYear: '연도',
        lOverview: '소개', lStack: '기술',
        overview: '여행이나 주말처럼 기간을 고르면, 그 기간의 사진을 iPhone 안에서 분석해 비슷한 사진은 한 묶음으로 모으고 흔들리거나 어두운 사진을 표시해요. 묶음마다 가장 잘 나온 사진을 추천해서, 사용자는 고르기만 하면 돼요. 사진은 기기 밖으로 나가지 않아요.',
        features: [
          ['비슷한 사진 묶기', '같은 장면을 연달아 찍은 사진을 묶고, 묶음마다 베스트 컷을 추천해요.'],
          ['흔들림·어두움 표시', '흔들린 사진, 너무 어둡거나 밝은 사진, 눈 감은 사진을 표시해요.'],
          ['도시별 자동 나누기', '여러 도시를 다녀온 여행은 사진 위치로 도시별로 나눠 폴더에 담아요.']
        ],
        hi: '안녕하세요, 건휘예요.', bio: 'AI와 디지털 경험을 만듭니다.',
        home: '홈', works: '프로젝트', about: '소개', backWorks: '프로젝트로 돌아가기'
      },
      en: {
        tagline: 'Keep only your best shots.',
        lType: 'Type', vType: 'Personal Project', lRole: 'Role', vRole: 'iOS Development · Design', lYear: 'Year',
        lOverview: 'Overview', lStack: 'Stack',
        overview: 'Pick a date range, like a trip or a weekend, and BestCut analyzes those photos on the iPhone. It groups similar shots, flags blurry or dark ones, and suggests the best photo in each group, so all you do is pick. Your photos never leave the device.',
        features: [
          ['Similar shots, grouped', 'Burst-like shots of the same scene land in one group, with the best one suggested.'],
          ['Blurry and dark, flagged', 'Shaky, too dark, too bright and eyes-closed photos are marked for you.'],
          ['Split by city', 'A multi-city trip is split by city using photo locations and kept in a folder.']
        ],
        hi: "Hi, I'm Geonhwi.", bio: 'I build AI & create digital experiences.',
        home: 'Home', works: 'Works', about: 'About', backWorks: 'Back to Works'
      },
      ja: {
        tagline: 'よく撮れた写真だけを残す写真整理アプリ',
        lType: '種類', vType: '個人プロジェクト', lRole: '役割', vRole: 'iOS開発・デザイン', lYear: '年',
        lOverview: '概要', lStack: '技術',
        overview: '旅行や週末など期間を選ぶと、その期間の写真をiPhoneの中で分析し、似た写真をまとめ、ブレた写真や暗い写真に印を付けます。グループごとに一番よく撮れた写真をおすすめするので、あとは選ぶだけ。写真が端末の外に出ることはありません。',
        features: [
          ['似た写真をまとめる', '同じ場面を続けて撮った写真をまとめ、グループごとにベストショットをおすすめします。'],
          ['ブレ・暗さを表示', 'ブレた写真、暗すぎる・明るすぎる写真、目をつぶった写真に印を付けます。'],
          ['都市ごとに自動で分ける', '複数の都市を巡った旅行は、写真の位置から都市ごとに分けてフォルダにまとめます。']
        ],
        hi: 'こんにちは、ゴンフィです。', bio: 'AIとデジタル体験をつくっています。',
        home: 'ホーム', works: 'プロジェクト', about: '紹介', backWorks: 'プロジェクトに戻る'
      }
    };

    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const galleries = [...document.querySelectorAll('.gal-pin')].map(pin => ({
      pin, track: pin.querySelector('.gal-track'), card: pin.querySelector('.gal-card'), bar: pin.querySelector('.gal-progress i'), max: 0
    }));

    function layoutGalleries() {
      galleries.forEach(g => {
        g.pin.classList.remove('static');
        g.track.style.transform = '';
        const overflow = g.track.scrollWidth - g.card.clientWidth;
        g.max = overflow > 48 ? overflow : 0;
        const pinned = !reduceMotion.matches && g.max > 0;
        g.pin.classList.toggle('static', !g.max);
        g.pin.style.height = pinned ? Math.round(window.innerHeight + g.max * 1.15) + 'px' : '';
        if (!pinned) g.track.style.transform = '';
      });
      updateGalleries();
    }

    function updateGalleries() {
      galleries.forEach(g => {
        let p = 0;
        if (reduceMotion.matches) {
          p = g.max ? g.card.scrollLeft / g.max : 0;
        } else if (g.max > 1) {
          const total = g.pin.offsetHeight - window.innerHeight;
          p = total > 0 ? Math.min(1, Math.max(0, -g.pin.getBoundingClientRect().top / total)) : 0;
          g.track.style.transform = 'translate3d(' + (-p * g.max).toFixed(1) + 'px,0,0)';
        }
        g.bar.style.width = (Math.min(1, Math.max(0, p)) * 100).toFixed(1) + '%';
      });
    }

    function setLang(lang) {
      if (!T[lang]) lang = 'ko';
      const t = T[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
      document.querySelectorAll('[data-aria]').forEach(el => el.setAttribute('aria-label', t[el.dataset.aria]));
      document.getElementById('features').innerHTML = t.features.map(([h, p]) => `<div class="card"><p class="value">${h}</p><p>${p}</p></div>`).join('');
      document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
      const sl = lang === 'ko' ? 'ko' : 'en';
      const shots = list => list.map(n => `<img src="../assets/bestcut/shots/${sl}/${n}.webp" alt="${BC_ALT[sl][n - 1]}" width="720" height="1564" decoding="async">`).join('');
      galleries.forEach(g => { g.track.innerHTML = shots(g.track.dataset.shots.split(',').map(Number)); });
      layoutGalleries();
      document.querySelectorAll('a[data-sec]').forEach(a => a.setAttribute('href', '../?lang=' + lang + '#' + a.dataset.sec));
      try { history.replaceState(null, '', '?lang=' + lang); } catch (e) {}
    }

    document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
    setLang(new URLSearchParams(location.search).get('lang') || 'ko');

    let lastWidth = document.documentElement.clientWidth;
    window.addEventListener('scroll', updateGalleries, { passive: true });
    window.addEventListener('resize', () => {
      const w = document.documentElement.clientWidth;
      if (w !== lastWidth) { lastWidth = w; layoutGalleries(); } else updateGalleries();
    });
    window.addEventListener('load', layoutGalleries);
    reduceMotion.addEventListener('change', layoutGalleries);
    galleries.forEach(g => g.card.addEventListener('scroll', updateGalleries, { passive: true }));

    const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }), { threshold: .12 }) : null;
    document.querySelectorAll('.reveal').forEach(el => io ? io.observe(el) : el.classList.add('in'));
  </script>
</body>
</html>
