<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BestCut | Geonhwi Yang</title>
  <meta name="description" content="BestCut: an iPhone app that groups similar shots and keeps only your best photos.">
  <meta property="og:title" content="BestCut | Geonhwi Yang">
  <meta property="og:description" content="An iPhone app that groups similar shots and keeps only your best photos.">
  <meta property="og:image" content="https://woyean5.github.io/assets/bestcut/icon.png">
  <link rel="icon" href="../assets/bestcut/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="../assets/bestcut/phones.css">
  <script src="../assets/bestcut/phones.js"></script>
  <style>
    :root { --bg: #FFFFFF; --ink: #000000; --muted: rgba(0,0,0,.5); --card: #F5F5F5; --accent: #0071E3; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body { background: var(--bg); color: var(--ink); font-family: 'Inter', 'Pretendard', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.5; padding-bottom: 140px; }
    html[lang="ja"] body { font-family: 'Inter', 'Noto Sans JP', 'Pretendard', sans-serif; }
    html[lang="ko"] body { word-break: keep-all; overflow-wrap: break-word; }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
    section + section, .stage + section { margin-top: 128px; }

    .label { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: -.005em; }
    .value { font-size: 21px; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; }
    .card { background: var(--card); border-radius: 28px; padding: 28px; }
    .ph { color: var(--muted); font-style: italic; font-weight: 500; }

    .hero { text-align: center; padding-top: 96px; }
    .hero img { width: 96px; height: 96px; border-radius: 22px; display: block; margin: 0 auto; }
    .hero h1 { margin-top: 28px; font-size: 48px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; }
    .hero p { margin-top: 12px; font-size: 21px; font-weight: 500; color: var(--muted); letter-spacing: -.01em; }

    .stage { position: relative; margin-top: 64px; }
    .stage::after { content: ''; position: absolute; left: 4%; right: 4%; bottom: -18px; height: 80px; background: #FAFAFA; border-radius: 0 0 28px 28px; z-index: -1; }
    .stage .card { padding: 56px 40px; border-radius: 32px; }
    .bc-phone { transition: transform .5s cubic-bezier(.16,1,.3,1); }
    .bc-phone:hover { transform: scale(1.02); }
    .bc-frame { box-shadow: 0 0 0 .3cqw rgba(0,0,0,.14), 0 5cqw 10cqw -5cqw rgba(0,0,0,.28); }

    .meta { display: grid; grid-template-columns: 1fr 1.6fr; gap: 16px; }
    .meta-list { display: flex; flex-direction: column; gap: 24px; }
    .meta-list .value, .overview .value { margin-top: 4px; }
    .overview p.body { margin-top: 10px; font-size: 17px; line-height: 1.6; color: var(--ink); }
    .overview .stack { margin-top: 24px; }

    .showcase { background: var(--card); border-radius: 32px; box-shadow: 0 20px 60px rgba(0,0,0,.08); overflow: hidden; padding: 56px 28px 0; }
    .showcase .bc-phones { align-items: flex-start; gap: 20px; margin-bottom: -26%; }
    .showcase .bc-phone, .showcase .bc-phone.mid { flex-basis: 300px; }
    .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; }
    .features .value { font-size: 20px; }
    .features p { margin-top: 6px; font-size: 15px; color: var(--muted); line-height: 1.5; }

    .bento { display: grid; gap: 16px; }
    .bento .r1 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .bento .r2 { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; }
    .bento .card { min-height: 150px; display: flex; flex-direction: column; }
    .bento .r1 .value { margin-top: auto; padding-top: 36px; word-break: break-all; }
    .bento .r1 a.card { transition: background .2s; }
    .bento .r1 a.card:hover { background: #EEEEEE; }
    .hi { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; }
    .hi span { display: block; color: var(--muted); }
    .avatar { margin-top: auto; padding-top: 28px; width: 112px; }
    .links { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .links ul { list-style: none; margin-top: 12px; display: grid; gap: 8px; }
    .links li a { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
    .links li a:hover { color: var(--muted); }
    .foot { margin-top: auto; padding-top: 40px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
    .foot a { color: var(--ink); font-weight: 600; }
    .foot a:hover { color: var(--muted); }

    .dockbar { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; z-index: 50; }
    .dock, .langs { display: flex; align-items: center; background: rgba(255,255,255,.72); -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8); box-shadow: 0 8px 32px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.06); border-radius: 999px; }
    .dock { gap: 8px; padding: 8px; }
    .dock a { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: var(--card); color: rgba(0,0,0,.62); transition: transform .25s cubic-bezier(.16,1,.3,1); transform-origin: 50% 100%; }
    .dock a:hover { transform: scale(1.18) translateY(-4px); }
    .dock a svg { width: 22px; height: 22px; }
    .dock .sep { width: 1px; height: 30px; background: rgba(0,0,0,.12); margin: 0 2px; }
    .dock a.mail { background: var(--accent); color: #fff; }
    .langs { padding: 6px; gap: 2px; }
    .langs button { border: 0; background: none; font: inherit; font-size: 12px; font-weight: 600; color: var(--muted); width: 36px; height: 36px; border-radius: 999px; cursor: pointer; }
    .langs button[aria-pressed="true"] { background: var(--ink); color: #fff; }

    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .6s ease-out, transform .6s ease-out; }
    .reveal.in { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .reveal { opacity: 1; transform: none; transition: none; } .bc-phone, .dock a { transition: none; } html { scroll-behavior: auto; } }

    @media (max-width: 768px) {
      section + section, .stage + section { margin-top: 96px; }
      .hero { padding-top: 64px; }
      .hero h1 { font-size: 40px; }
      .hero p { font-size: 18px; }
      .stage { margin-top: 48px; }
      .stage .card { padding: 32px 0; }
      .stage .bc-phones, .showcase .bc-phones { justify-content: flex-start; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 0 16px 8px; gap: 16px; scroll-padding: 0 16px; }
      .stage .bc-phones::-webkit-scrollbar, .showcase .bc-phones::-webkit-scrollbar { display: none; }
      .stage .bc-phone, .stage .bc-phone.mid, .showcase .bc-phone, .showcase .bc-phone.mid { flex: 0 0 62%; scroll-snap-align: center; }
      .stage .bc-phone:hover, .showcase .bc-phone:hover { transform: none; }
      .showcase { padding: 32px 0 0; }
      .showcase .bc-phones { margin-bottom: -40%; }
      .meta, .features, .bento .r1, .bento .r2, .links { grid-template-columns: 1fr; }
      .card { padding: 24px; }
      .dock { gap: 6px; padding: 6px; }
      .dock a { width: 44px; height: 44px; border-radius: 14px; }
      .langs button { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero reveal">
      <img src="../assets/bestcut/icon.png" alt="BestCut app icon" width="96" height="96">
      <h1>BestCut</h1>
      <p data-t="tagline"></p>
    </section>

    <div class="stage reveal">
      <div class="card"><div id="phones-main" class="bc-phones"></div></div>
    </div>

    <section class="meta reveal">
      <div class="card meta-list">
        <div><p class="label" data-t="lType"></p><p class="value" data-t="vType"></p></div>
        <div><p class="label" data-t="lRole"></p><p class="value ph" data-t="vRole"></p></div>
        <div><p class="label" data-t="lYear"></p><p class="value">2026</p></div>
      </div>
      <div class="card overview">
        <p class="label" data-t="lOverview"></p>
        <p class="body" data-t="overview"></p>
        <div class="stack"><p class="label" data-t="lStack"></p><p class="value">Swift 6 · SwiftUI · Vision · PhotoKit · SwiftData</p></div>
      </div>
    </section>

    <section class="reveal">
      <div class="showcase"><div id="phones-more" class="bc-phones"></div></div>
      <div class="features" id="features"></div>
    </section>

    <section class="bento reveal" id="contact">
      <div class="r1">
        <a class="card" href="mailto:woyean5@gmail.com"><p class="label">Let's Talk</p><p class="value">woyean5@gmail.com</p></a>
        <a class="card" href="https://instagram.com/217.1717" target="_blank" rel="noopener noreferrer"><p class="label">Instagram</p><p class="value">@217.1717</p></a>
      </div>
      <div class="r2">
        <div class="card">
          <p class="hi"><span style="color:var(--ink)" data-t="hi"></span><span data-t="bio"></span></p>
          <svg class="avatar" viewBox="0 0 120 120" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M36 50c0-16 10.7-27 24-27s24 11 24 27c0 15.5-10.7 29-24 29S36 65.5 36 50Z"/>
            <path d="M35 46c4-14 14-22 27-21 11 .8 19 7 23 18-9-1-17-5-22-11-5 8-15 13-28 14"/>
            <path d="M50 52v3M70 52v3"/>
            <path d="M53 64c4 3.5 10 3.5 14 0"/>
            <path d="M48 78c-1 4-1 7 0 10M72 78c1 4 1 7 0 10"/>
            <path d="M22 118c2-16 13-27 26-30l12 9 12-9c13 3 24 14 26 30"/>
          </svg>
        </div>
        <div class="card">
          <div class="links">
            <div><p class="label">Menu</p><ul><li><a href="../#home" data-sec="home" data-t="home"></a></li><li><a href="../#works" data-sec="works" data-t="works"></a></li><li><a href="../#about" data-sec="about" data-t="about"></a></li></ul></div>
            <div><p class="label">Follow</p><ul>
              <li><a href="https://github.com/woyean5" target="_blank" rel="noopener noreferrer">GitHub</a></li>
              <li><a href="https://youtube.com/@conner_217" target="_blank" rel="noopener noreferrer">YouTube</a></li>
              <li><a href="https://instagram.com/217.1717" target="_blank" rel="noopener noreferrer">Instagram</a></li>
              <li><a href="https://open.spotify.com/user/31qbsjuqdlm53dftufzlqi2z56i4" target="_blank" rel="noopener noreferrer">Spotify</a></li>
            </ul></div>
          </div>
          <div class="foot"><span>© 2026, Geonhwi Yang</span><a href="../#works" data-sec="works" data-t="backWorks"></a></div>
        </div>
      </div>
    </section>
  </main>

  <nav class="dockbar" aria-label="Dock">
    <div class="dock">
      <a href="../#home" data-sec="home" data-aria="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></a>
      <a href="../#works" data-sec="works" data-aria="works"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg></a>
      <a href="../#about" data-sec="about" data-aria="about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.3-7 8-7s7 2.5 8 7"/></svg></a>
      <span class="sep" aria-hidden="true"></span>
      <a href="mailto:woyean5@gmail.com" class="mail" aria-label="Email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="m3.5 7 8.5 6 8.5-6"/></svg></a>
    </div>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="en">EN</button><button data-lang="ko">KO</button><button data-lang="ja">JA</button>
    </div>
  </nav>

  <script>
    const T = {
      ko: {
        tagline: '잘 나온 사진만 남기는 사진 정리 앱',
        lType: '유형', vType: '개인 프로젝트', lRole: '역할', vRole: '[작성 예정: 예) iOS 개발 · 디자인]', lYear: '연도',
        lOverview: '소개', lStack: '기술',
        overview: '여행이나 주말처럼 기간을 고르면, 그 기간의 사진을 iPhone 안에서 분석해 비슷한 사진은 한 묶음으로 모으고 흔들리거나 어두운 사진을 표시해요. 묶음마다 가장 잘 나온 사진을 추천해서, 사용자는 고르기만 하면 돼요. 사진은 기기 밖으로 나가지 않아요.',
        features: [
          ['비슷한 사진 묶기', '같은 장면을 연달아 찍은 사진을 묶고, 묶음마다 베스트 컷을 추천해요.'],
          ['흔들림·어두움 표시', '흔들린 사진, 너무 어둡거나 밝은 사진, 눈 감은 사진을 표시해요.'],
          ['도시별 자동 나누기', '여러 도시를 다녀온 여행은 사진 위치로 도시별로 나눠 폴더에 담아요.']
        ],
        hi: '안녕하세요, 건휘예요.', bio: 'AI와 디지털 경험을 만듭니다.',
        home: '홈', works: '프로젝트', about: '소개', backWorks: '프로젝트로 돌아가기'
      },
      en: {
        tagline: 'Keep only your best shots.',
        lType: 'Type', vType: 'Personal Project', lRole: 'Role', vRole: '[To be added: e.g. iOS Developer & Designer]', lYear: 'Year',
        lOverview: 'Overview', lStack: 'Stack',
        overview: 'Pick a date range, like a trip or a weekend, and BestCut analyzes those photos on the iPhone. It groups similar shots, flags blurry or dark ones, and suggests the best photo in each group, so all you do is pick. Your photos never leave the device.',
        features: [
          ['Similar shots, grouped', 'Burst-like shots of the same scene land in one group, with the best one suggested.'],
          ['Blurry and dark, flagged', 'Shaky, too dark, too bright and eyes-closed photos are marked for you.'],
          ['Split by city', 'A multi-city trip is split by city using photo locations and kept in a folder.']
        ],
        hi: "Hi, I'm Geonhwi.", bio: 'I build AI & create digital experiences.',
        home: 'Home', works: 'Works', about: 'About', backWorks: 'Back to Works'
      },
      ja: {
        tagline: 'よく撮れた写真だけを残す写真整理アプリ',
        lType: '種類', vType: '個人プロジェクト', lRole: '役割', vRole: '[入力予定: 例）iOS開発・デザイン]', lYear: '年',
        lOverview: '概要', lStack: '技術',
        overview: '旅行や週末など期間を選ぶと、その期間の写真をiPhoneの中で分析し、似た写真をまとめ、ブレた写真や暗い写真に印を付けます。グループごとに一番よく撮れた写真をおすすめするので、あとは選ぶだけ。写真が端末の外に出ることはありません。',
        features: [
          ['似た写真をまとめる', '同じ場面を続けて撮った写真をまとめ、グループごとにベストショットをおすすめします。'],
          ['ブレ・暗さを表示', 'ブレた写真、暗すぎる・明るすぎる写真、目をつぶった写真に印を付けます。'],
          ['都市ごとに自動で分ける', '複数の都市を巡った旅行は、写真の位置から都市ごとに分けてフォルダにまとめます。']
        ],
        hi: 'こんにちは、ゴンフィです。', bio: 'AIとデジタル体験をつくっています。',
        home: 'ホーム', works: 'プロジェクト', about: '紹介', backWorks: 'プロジェクトに戻る'
      }
    };

    function setLang(lang) {
      if (!T[lang]) lang = 'ko';
      const t = T[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
      document.querySelectorAll('[data-aria]').forEach(el => el.setAttribute('aria-label', t[el.dataset.aria]));
      document.getElementById('features').innerHTML = t.features.map(([h, p]) => `<div class="card"><p class="value">${h}</p><p>${p}</p></div>`).join('');
      document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
      renderBestcutPhones(document.getElementById('phones-main'), lang, ['home', 'swipe', 'summary']);
      renderBestcutPhones(document.getElementById('phones-more'), lang, ['trips', 'review', 'flagged']);
      document.querySelectorAll('a[data-sec]').forEach(a => a.setAttribute('href', '../?lang=' + lang + '#' + a.dataset.sec));
      try { history.replaceState(null, '', '?lang=' + lang); } catch (e) {}
    }

    document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
    setLang(new URLSearchParams(location.search).get('lang') || 'ko');

    const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }), { threshold: .12 }) : null;
    document.querySelectorAll('.reveal').forEach(el => io ? io.observe(el) : el.classList.add('in'));
  </script>
</body>
</html>
