        more: 'ほかのプロジェクトを見る'
      }
    };

    function setLang(lang) {
      if (!T[lang]) lang = 'ko';
      const t = T[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
      document.getElementById('features').innerHTML = t.features.map(([ic, h, p]) =>
        `<div class="feat"><div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[ic]}</svg></div><h3>${h}</h3><p>${p}</p></div>`).join('');
      document.getElementById('steps').innerHTML = t.steps.map(([b, s]) => `<li><div><b>${b}</b><span>${s}</span></div></li>`).join('');
      document.getElementById('tech').innerHTML = t.tech.map(x => `<li>${x}</li>`).join('');
      document.getElementById('privacy').innerHTML = t.privacy.map(x => `<li>${x}</li>`).join('');
      document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
      renderBestcutPhones(document.getElementById('bc-phones'), lang);
      document.querySelector('.back').href = '../?lang=' + lang + '#app';
      document.querySelector('.home-btn').href = '../?lang=' + lang + '#works';
      try { history.replaceState(null, '', '?lang=' + lang); } catch (e) {}
    }

    document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
    setLang(new URLSearchParams(location.search).get('lang') || 'ko');

    const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
    }), { threshold: .12 }) : null;
    document.querySelectorAll('.reveal').forEach(el => io ? io.observe(el) : el.classList.add('in'));
  </script>
</body>
</html>
